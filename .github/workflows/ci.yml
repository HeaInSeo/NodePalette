name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION_FILE: go.mod
  COVERAGE_THRESHOLD: "70.0"
  GOLANGCI_LINT_VERSION: v2.11.3
  GOVULNCHECK_VERSION: v1.1.4
  ACTIONLINT_VERSION: v1.7.7

jobs:
  # ──────────────────────────────────────────────────────────────────
  # 0. 워크플로 YAML 자체 린트
  # ──────────────────────────────────────────────────────────────────
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - name: Validate GitHub Actions workflows
        run: go run "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"

  # ──────────────────────────────────────────────────────────────────
  # 1. 린트 (golangci-lint)
  # ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-mode: goinstall
          args: --config=.golangci.yml --timeout 10m

  # ──────────────────────────────────────────────────────────────────
  # 1b. go.mod/go.sum drift 검증
  # ──────────────────────────────────────────────────────────────────
  module-drift:
    name: Module Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - name: Verify go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          test -z "$(git status --porcelain -- go.mod go.sum)"

  # ──────────────────────────────────────────────────────────────────
  # 2. 빌드 검증
  # ──────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

  # ──────────────────────────────────────────────────────────────────
  # 3. 유닛 테스트 (-race, -cover, 70% gate)
  # ──────────────────────────────────────────────────────────────────
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - name: go test (unit, -race, -cover)
        run: |
          go test \
            -v \
            -race \
            -covermode=atomic \
            -coverprofile=coverage.out \
            ./...

      - name: Enforce coverage >= 70%
        run: |
          coverage="$(go tool cover -func=coverage.out | awk '/^total:/ { gsub(/%/, "", $3); print $3 }')"
          awk -v got="$coverage" -v want="$COVERAGE_THRESHOLD" 'BEGIN {
            if (got + 0 < want + 0) {
              printf("coverage %.1f%% below required %.1f%%\n", got, want)
              exit 1
            }
            printf("coverage %.1f%% >= %.1f%%\n", got, want)
          }'

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-${{ github.run_id }}
          path: coverage.out
          retention-days: 14

  # ──────────────────────────────────────────────────────────────────
  # 4. K8s data-plane contract tests (bori-facing manifests)
  # ──────────────────────────────────────────────────────────────────
  k8s-contract:
    name: K8s Data Plane Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - name: manifest contract tests
        run: go test -v ./test/k8s/...

  # ──────────────────────────────────────────────────────────────────
  # 5. 취약점 스캔 (govulncheck)
  # ──────────────────────────────────────────────────────────────────
  vuln-scan:
    name: Vulnerability Scan (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - name: govulncheck
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          govulncheck ./...
