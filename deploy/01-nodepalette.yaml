---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodepalette
  namespace: nodepalette-system
  labels:
    app.kubernetes.io/name: nodepalette
    app.kubernetes.io/component: palette-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: nodepalette
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nodepalette
        app.kubernetes.io/component: palette-api
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nodepalette
          image: harbor.10.113.24.96.nip.io/nodevault/nodepalette:v0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8083
              protocol: TCP
          env:
            - name: NODEPALETTE_ADDR
              value: ":8083"
            - name: NODEVAULT_API_ADDR
              value: http://nodevault-controlplane.nodevault-system.svc:8082
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: nodepalette
  namespace: nodepalette-system
  labels:
    app.kubernetes.io/name: nodepalette
spec:
  selector:
    app.kubernetes.io/name: nodepalette
  ports:
    - name: http
      port: 8083
      targetPort: http
      protocol: TCP
